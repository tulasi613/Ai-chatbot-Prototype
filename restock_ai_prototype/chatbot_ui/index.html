<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restock Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161c;
    --panel: #1a2029;
    --panel-alt: #202836;
    --border: #2a3242;
    --text: #e7ebf1;
    --text-dim: #8b93a5;
    --amber: #f2a93b;
    --amber-dim: #4a3a1c;
    --green: #4fc38a;
    --green-dim: #16352a;
    --red: #e8637a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 860px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, #1c2330, #1a2029);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 4px var(--amber-dim);
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header p { margin: 0; font-size: 12px; color: var(--text-dim); }

  .chips {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    background: #151b23;
  }
  .chip {
    flex: 0 0 auto;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--amber); color: var(--amber); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 86%; display: flex; flex-direction: column; gap: 6px; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; }
  .bubble {
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .msg.bot .bubble { background: var(--panel-alt); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .bubble { background: #2c3550; border-top-right-radius: 4px; }

  .card {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .card img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #333; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 13px; font-weight: 600; }
  .card .meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .gauge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--green-dim);
    color: var(--green);
    flex-shrink: 0;
  }
  .eta-box {
    font-family: 'JetBrains Mono', monospace;
    background: var(--amber-dim);
    color: var(--amber);
    border: 1px solid #5a4726;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .eta-box .big { font-size: 18px; font-weight: 700; }

  .subscribe-form {
    display: flex; flex-direction: column; gap: 6px; margin-top: 4px;
  }
  .subscribe-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12.5px;
  }
  .subscribe-form button, .send-btn {
    background: var(--amber);
    color: #1a1300;
    border: none;
    padding: 8px 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
  }
  .subscribe-form button:hover, .send-btn:hover { filter: brightness(1.08); }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: #151b23;
  }
  .input-row input {
    flex: 1;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
  }
  .input-row input:focus { outline: none; border-color: var(--amber); }
  .send-btn { padding: 10px 16px; border-radius: 10px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="dot"></div>
    <div>
      <h1>Restock Assistant</h1>
      <p>Ask about any product's availability</p>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="messages" id="messages"></div>

  <div class="input-row">
    <input id="textInput" type="text" placeholder="Type a product name, e.g. 'headphones'…" />
    <button class="send-btn" onclick="handleUserSearch()">Send</button>
  </div>
</div>

<script>
// Point this at your Flask backend
const API_BASE = "http://localhost:5000/api";

const messagesEl = document.getElementById("messages");
const chipsEl = document.getElementById("chips");

function addBotBubble(html) {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.innerHTML = `<div class="bubble">${html}</div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function addBotNode(node) {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.appendChild(node);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addUserBubble(text) {
  const wrap = document.createElement("div");
  wrap.className = "msg user";
  wrap.innerHTML = `<div class="bubble">${text}</div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadQuickProducts() {
  try {
    const res = await fetch(`${API_BASE}/products`);
    const products = await res.json();
    // Show a handful of chips, prioritizing out-of-stock items for demo purposes
    const picks = products.slice(0, 8);
    picks.forEach(p => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = p.name;
      chip.onclick = () => askAboutProduct(p);
      chipsEl.appendChild(chip);
    });
  } catch (e) {
    addBotBubble("⚠️ Couldn't reach the backend at " + API_BASE + ". Make sure app.py is running.");
  }
}

async function findProductByName(name) {
  const res = await fetch(`${API_BASE}/products?q=${encodeURIComponent(name)}`);
  const results = await res.json();
  return results[0] || null;
}

function handleUserSearch() {
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;
  addUserBubble(text);
  input.value = "";
  findProductByName(text).then(p => {
    if (!p) {
      addBotBubble(`I couldn't find a product matching "${text}". Try another name.`);
      return;
    }
    askAboutProduct(p);
  });
}

document.getElementById("textInput").addEventListener("keydown", e => {
  if (e.key === "Enter") handleUserSearch();
});

// ---- ENDPOINT 1: availability ----
async function askAboutProduct(product) {
  addUserBubble(`Is "${product.name}" available?`);
  const res = await fetch(`${API_BASE}/chat/availability`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ product_id: product.product_id, query_text: `availability check: ${product.name}` })
  });
  const data = await res.json();

  if (data.in_stock) {
    addBotBubble(`✅ ${data.message}`);
    return;
  }

  const box = document.createElement("div");
  box.innerHTML = `
    <div class="bubble" style="margin-bottom:8px;">${data.message.split('Expected')[0]}</div>
    <div class="eta-box">
      <div class="big">${data.eta_min_days}–${data.eta_max_days} days</div>
      Estimated restock · ${data.confidence_pct}% confidence<br>
      <span style="opacity:.75">Supplier: ${data.supplier_name}</span>
    </div>
  `;
  addBotNode(box);

  // Chain into alternatives + subscribe prompts
  await suggestAlternatives(product);
  offerSubscribe(product);
}

// ---- ENDPOINT 2: alternatives ----
async function suggestAlternatives(product) {
  const res = await fetch(`${API_BASE}/chat/alternatives`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ product_id: product.product_id, query_text: `alternatives for: ${product.name}` })
  });
  const data = await res.json();

  if (!data.alternatives || data.alternatives.length === 0) {
    addBotBubble("I couldn't find close alternatives in stock right now.");
    return;
  }

  addBotBubble("While you wait, here are some in-stock alternatives:");
  data.alternatives.forEach(alt => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${alt.image_url}" alt="${alt.name}">
      <div class="info">
        <div class="name">${alt.name}</div>
        <div class="meta">$${alt.price.toFixed(2)} · ${alt.stock_level} in stock</div>
      </div>
      <div class="gauge">${alt.match_score}% Match</div>
    `;
    addBotNode(card);
  });
}

// ---- ENDPOINT 3: subscribe ----
function offerSubscribe(product) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="bubble" style="margin-bottom:8px;">Want us to notify you the moment it's back?</div>
    <div class="subscribe-form">
      <input type="email" placeholder="Email (or leave blank)" id="sub-email-${product.product_id}">
      <input type="tel" placeholder="Phone (optional)" id="sub-phone-${product.product_id}">
      <button onclick="submitSubscribe(${product.product_id}, '${product.name.replace(/'/g, "\\'")}')">Notify Me</button>
    </div>
  `;
  addBotNode(wrap);
}

async function submitSubscribe(productId, productName) {
  const email = document.getElementById(`sub-email-${productId}`).value.trim();
  const phone = document.getElementById(`sub-phone-${productId}`).value.trim();
  if (!email && !phone) {
    addBotBubble("Please enter an email or phone number so we can notify you.");
    return;
  }
  const res = await fetch(`${API_BASE}/chat/subscribe`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ product_id: productId, email, phone })
  });
  const data = await res.json();
  addUserBubble(`Notify me: ${email || phone}`);
  addBotBubble(`🔔 ${data.message}`);
}

// Boot
addBotBubble("Hi! I'm your Restock Assistant. Tap a product below or type a name to check availability.");
loadQuickProducts();
</script>
</body>
</html>
